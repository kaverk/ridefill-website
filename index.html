<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Coming soon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2353D5F6'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.25rem;
      background: #53D5F6;
      color: #1B3A4B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    p {
      margin: 0;
      max-width: none;
      font-size: clamp(1.5rem, 4vw, 2.75rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.25;
      text-wrap: balance;
      animation: fade-in 1.1s ease-out both;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(0.4rem);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      p {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <p>Good things are coming soon...</p>
</body>
</html>
